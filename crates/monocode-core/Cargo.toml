[package]
workspace = "../monocode-gpui"
name = "monocode-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# Starts terminal children on macOS without loading the app's image
# (process::pty); the app bundle carries it beside the app. A C main, so no
# test harness.
[[bin]]
name = "monocode-pty-exec"
path = "src/bin/monocode-pty-exec.rs"
test = false
bench = false

[features]
# Scripted peers for the tests of crates that call the code services.
test-support = []

[dependencies]
serde.workspace = true
# Stored floats must reload exactly, or saved revisions stop matching.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
rusqlite.workspace = true
async-channel = "2"
shlex = "2"
url = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
rand = "0.9"
regex = "1"
zstd = "0.14.3"
toml = "0.8"
yaml-rust2 = { version = "0.13", default-features = false }
ureq = "2.12"
webpki-roots = "0.26.11"
similar = "2"
unicode-width = "0.2"
monocode-mobile-link = { path = "../mobile-link" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.15"
hostname = "0.4"
igd-next = "0.18"
natpmp = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rquickjs = "0.14.0"
semver = { version = "1", features = ["serde"] }
minisign-verify = "0.2.5"
tempfile = "3"
flate2 = "1"
tar = "0.4"
tokio-postgres = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mongodb = "3"
# The external CDP endpoint's WebSocket framing (browser::proxy); the
# handshake is ours, so no `handshake` feature.
tungstenite = { version = "0.30", default-features = false }
sha1 = "0.10"
# Importing cookies and passwords from Chrome, Arc and Brave (browser::import, K61).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
rusty-leveldb = "1"
tempfile = "3"

# Exercise WebView2 storage fixtures on Linux and macOS too.
[target.'cfg(not(windows))'.dev-dependencies]
rusty-leveldb = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
futures-executor = "0.3"
